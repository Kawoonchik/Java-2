<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingvo - Мої картки</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 800px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; }
        input, button { padding: 10px; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1 style="margin: 0;">Словник Lingvo</h1>
    <form action="/logout" method="post" style="margin: 0;">
        <button type="submit" style="background-color: #6c757d; border-radius: 5px;">Вийти з акаунта</button>
    </form>
</div>

<form id="cardForm">
    <h3>Додати нову картку</h3>
    <input type="text" id="term" placeholder="Термін (напр., 語法)" required>
    <input type="text" id="translation" placeholder="Переклад (напр., граматика)" required>
    <input type="text" id="exampleSentence" placeholder="Приклад речення">
    <input type="text" id="language" placeholder="Мова (напр., Japanese)" required>
    <button type="submit">Зберегти картку</button>
</form>

<h3>Мої збережені картки</h3>
<table>
    <thead>
    <tr>
        <th>Термін</th>
        <th>Переклад</th>
        <th>Приклад</th>
        <th>Мова</th>
        <th>Дія</th>
    </tr>
    </thead>
    <tbody id="cardsTableBody">
    <!-- Дані будуть завантажені через JS -->
    </tbody>
</table>

<script>
    const API_URL = '/api/cards';

    // Завантаження карток при відкритті сторінки
    document.addEventListener('DOMContentLoaded', loadCards);

    // Обробка форми додавання
    document.getElementById('cardForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const newCard = {
            term: document.getElementById('term').value,
            translation: document.getElementById('translation').value,
            exampleSentence: document.getElementById('exampleSentence').value,
            language: document.getElementById('language').value
        };

        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newCard)
        });

        if (response.ok) {
            document.getElementById('cardForm').reset();
            loadCards(); // Оновлюємо таблицю
        } else {
            alert('Помилка при збереженні картки. Перевірте права доступу.');
        }
    });

    // Отримання списку карток
    async function loadCards() {
        const response = await fetch(API_URL);
        if (!response.ok) return;

        const cards = await response.json();
        const tbody = document.getElementById('cardsTableBody');
        tbody.innerHTML = '';

        cards.forEach(card => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                    <td>${card.term}</td>
                    <td>${card.translation}</td>
                    <td>${card.exampleSentence || '-'}</td>
                    <td>${card.language}</td>
                    <td><button onclick="deleteCard(${card.id})" style="background-color: #dc3545;">Видалити</button></td>
                `;
            tbody.appendChild(tr);
        });
    }

    // Видалення картки
    async function deleteCard(id) {
        const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });

        if (response.ok) {
            loadCards();
        } else if (response.status === 403) {
            alert('У вас немає прав для видалення (потрібна роль ADMIN).');
        }
    }
</script>
</body>
</html>
