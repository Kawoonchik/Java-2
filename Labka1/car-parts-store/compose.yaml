services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/course-realm.json:/opt/keycloak/data/import/course-realm.json:ro

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: car_parts_store
      MARIADB_USER: appuser
      MARIADB_PASSWORD: appuser
      MARIADB_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"